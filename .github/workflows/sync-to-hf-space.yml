name: Sync to Hugging Face Space

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Push to Hugging Face Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          git remote add space https://Evasim:${HF_TOKEN}@huggingface.co/spaces/Evasim/Simple-Text-Classifier
          git checkout --orphan space-sync
          git add -A
          git commit -m "Sync from GitHub ${GITHUB_SHA}"
          git push --force space space-sync:main
